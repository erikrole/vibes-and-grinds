name: Frontend Build Check

on:
  pull_request:
  push:
    branches:
      - main
      - work

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            backend/package-lock.json

      - name: Install frontend dependencies
        run: cd frontend && npm ci

      - name: Install backend dependencies
        run: cd backend && npm ci

      - name: Test owner and data integrity
        run: cd backend && npm test

      - name: Test journal and maps
        run: cd frontend && npm test

      - name: Build frontend
        run: cd frontend && npm run build

      - name: Validate backend/function syntax
        run: |
          for file in shared/*.mjs; do node --check "$file"; done
          for file in $(find functions -name '*.js'); do node --check "$file"; done
          node --check backend/server.js
          node --check backend/database.js
