name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - work

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json
            backend/package-lock.json

      - name: Install root dependencies
        run: npm ci

      - name: Install frontend dependencies
        run: cd frontend && npm ci

      - name: Run root tests (Cloudflare Functions + shared modules)
        run: npm test

      - name: Run frontend tests
        run: cd frontend && npm test

      - name: Build frontend
        run: cd frontend && npm run build

      - name: Validate function syntax
        run: |
          node --check backend/server.js
          node --check functions/api/places-autocomplete.js
          node --check functions/api/places-details.js
          node --check functions/api/stats.js
          node --check functions/api/upload.js
          node --check functions/api/visits.js
          node --check "functions/api/visits/[id].js"
          node --check functions/api/vest/blurb.js
          node --check functions/api/vest/games.js
          node --check functions/api/vest/net-rankings.js
          node --check functions/api/vest/scores.js
          node --check "functions/api/vest/game-stats/[eventId].js"
          node --check shared/constants.js
          node --check shared/html-parsing.js
